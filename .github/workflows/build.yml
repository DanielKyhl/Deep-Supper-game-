# Builds Deep Supper for Mac (Apple Silicon and Intel) and Windows.
#
# Every push to main builds and tests both, so a broken build shows up
# straight away; the files are kept for a week under the run's Artifacts.
# Pushing a tag, or publishing a release on GitHub with a new tag, also
# puts the builds on that release, creating it first if it doesn't exist.

name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit and integration tests
        run: npm test
      - name: Build the Mac apps (arm64 and x64 .dmg)
        run: npm run dist:mac
      - name: End-to-end tests against the packaged Apple Silicon app
        env:
          DEEPSUPPER_EXE: dist/mac-arm64/Deep Supper.app/Contents/MacOS/Deep Supper
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac
          path: dist/*.dmg
          if-no-files-found: warn
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit and integration tests
        run: npm test
      - name: Build the Windows app (portable .exe)
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true
      - name: Put the builds on the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l builds
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            cat > notes.md <<'EOF'
          **Mac:** download the `-mac-arm64.dmg` for Apple Silicon (M1 and later) or the `-mac-x64.dmg` for an Intel Mac. Open it and drag Deep Supper into Applications. The game isn't signed by Apple, so the first time you open it macOS will refuse: go to System Settings → Privacy & Security, scroll down, and click **Open Anyway**.

          **Windows:** download the `.exe` and run it. If Windows SmartScreen warns you, click **More info → Run anyway**.
          EOF
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "${TAG//_/ }" --notes-file notes.md
          fi
          gh release upload "$TAG" builds/* --repo "$GITHUB_REPOSITORY" --clobber
