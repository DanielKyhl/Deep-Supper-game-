# Builds Deep Supper for Mac (Apple Silicon and Intel) and Windows.
#
# Every push to main builds and tests both, so a broken build shows up
# straight away; the files are kept for a week under the run's Artifacts.
# Publishing a release on GitHub builds that version and attaches the .dmg
# files and the .exe to the release.

name: Build

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit and integration tests
        run: npm test
      - name: Build the Mac apps (arm64 and x64 .dmg)
        run: npm run dist:mac
      - name: End-to-end tests against the packaged Apple Silicon app
        env:
          DEEPSUPPER_EXE: dist/mac-arm64/Deep Supper.app/Contents/MacOS/Deep Supper
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac
          path: dist/*.dmg
          if-no-files-found: warn
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit and integration tests
        run: npm test
      - name: Build the Windows app (portable .exe)
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'release'
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true
      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -l builds
          gh release upload "$TAG" builds/* --repo "$GITHUB_REPOSITORY" --clobber
