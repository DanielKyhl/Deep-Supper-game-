<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Deep Supper</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #07080f;
    overflow: hidden;
    user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game {
    /* size is set from JS in real device pixels (fitCanvas in core.js) */
    display: block;
    background: #0a1226;
    image-rendering: pixelated;
    cursor: default;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
  </div>

  <script src="src/font.js"></script>
  <script src="src/core.js"></script>
  <script src="src/music.js"></script>
  <script src="src/data.js"></script>
  <script src="src/settings.js"></script>
  <script src="src/art.js"></script>
  <script src="src/art-deep.js"></script>
  <script src="src/cutscene.js"></script>
  <script src="src/fishing.js"></script>
  <script src="src/battle.js"></script>
  <script src="src/shop.js"></script>
  <script src="src/menu.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
