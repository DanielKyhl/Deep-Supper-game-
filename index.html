<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Supper — A Fishing Tale</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #07080f;
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
  }
  #game {
    display: block;
    background: #0a1226;
    max-width: 100vw;
    max-height: calc(100vh - 44px);
    aspect-ratio: 16 / 9;
    width: min(100vw, calc((100vh - 44px) * 16 / 9));
    height: auto;
    box-shadow: 0 0 0 1px #2a3352, 0 24px 60px rgba(0,0,0,.7);
    border-radius: 3px;
    cursor: default;
  }
  #hint {
    color: #6a7699;
    font: 12px/1.5 Verdana, system-ui, sans-serif;
    letter-spacing: .04em;
    text-align: center;
    padding: 0 10px;
    user-select: none;
  }
  #hint b { color: #99a7cf; font-weight: 600; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="hint">
      <b>A</b>/<b>D</b> move &nbsp;·&nbsp; <b>Space</b> jump &nbsp;·&nbsp; <b>E</b> interact &nbsp;·&nbsp;
      <b>J</b> attack &nbsp;·&nbsp; <b>K</b> roll &nbsp;·&nbsp; <b>Q</b> bandage &nbsp;·&nbsp;
      <b>M</b> mute &nbsp;·&nbsp; <b>Esc</b> back
    </div>
  </div>

  <script src="src/core.js"></script>
  <script src="src/data.js"></script>
  <script src="src/art.js"></script>
  <script src="src/cutscene.js"></script>
  <script src="src/fishing.js"></script>
  <script src="src/battle.js"></script>
  <script src="src/shop.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
